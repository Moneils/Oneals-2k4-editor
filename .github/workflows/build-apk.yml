
name: Build Oneals 2K4 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q Oneals_2K4_Android_Tablet_ISO_Patching_Source.zip -d extracted

      - name: Build APK
        shell: bash
        run: |
          cd extracted
          PROJECT=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$PROJECT"
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oneals-2K4-Android-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
