
name: Build Oneals 2K4 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

     
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null || true
          

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q Oneals_2K4_Editor_Full_Formation_View_Fixed.zip -d extracted
      - name: Repair missing error helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = next(Path("extracted").rglob("MainActivity.java"))
          source = p.read_text()
          marker = "public class MainActivity extends"

          if "void error(String" not in source:
              import re
              source, count = re.subn(
                  r'(public class MainActivity extends [^{]+\{)',
                  r'\1\n  void error(String message) {\n'
                  r'    android.widget.Toast.makeText(this, message, '
                  r'android.widget.Toast.LENGTH_LONG).show();\n'
                  r'  }\n',
                  source,
                  count=1
              )
              if count != 1:
                  raise RuntimeError("Could not locate MainActivity class")
              p.write_text(source)
          PY
          
      - name: Build APK
        shell: bash
        run: |
          cd extracted
          PROJECT=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$PROJECT"
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oneals-2K4-Android-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
